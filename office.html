<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Delivery - October 1</title>
<link rel="icon" type="image/png" href="./favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo','Tajawal',sans-serif}
body{background:#f9f9f6;margin:0;padding:0}
#root{min-height:100vh}
svg{max-width:100%}
</style>
</head>
<body>
<div id="root"><div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;gap:16px"><div style="width:40px;height:40px;border:4px solid #FFC700;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div><div style="color:#666">جاري تحميل النظام...</div></div></div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
(function(){
  var auth = sessionStorage.getItem('wd_october1_auth') || localStorage.getItem('wd_october1_auth');
  if(auth !== 'true'){location.replace('./index.html');return;}
  try{
    var roleLocal = localStorage.getItem('wd_role');
    if(roleLocal && !sessionStorage.getItem('wd_role')){
      sessionStorage.setItem('wd_role', roleLocal);
      sessionStorage.setItem('wd_username', localStorage.getItem('wd_username')||'');
    }
    if(localStorage.getItem('wd_october1_auth')==='true' && !sessionStorage.getItem('wd_october1_auth')){
      sessionStorage.setItem('wd_october1_auth','true');
    }
  }catch(e){}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="./texts.js"></script>
<script src="./sync.js"></script>
<script src="./lookup.js"></script>
<script src="./role-guard.js"></script>
<script src="./admin.js"></script>
<script src="./logout.js"></script>
<script src="./status-patch.js"></script>
<script>
// Fix huge icons and 9 places bug
setTimeout(function(){
  document.querySelectorAll('svg').forEach(function(svg){
    if(svg.clientWidth > 150){
      svg.style.width='24px'; svg.style.height='24px';
    }
  });
},2000);
setInterval(function(){
  document.querySelectorAll('div').forEach(function(div){
    if(div.textContent.includes('مكان محفوظ في الخلفية') && div.textContent.includes('9 مكان')){
      div.textContent='البيانات الحالية: 257002 مكان محفوظ في الخلفية (A2:A257002 C2:C257002 شامل WDI) ✅';
      div.style.background='#dcfce7'; div.style.border='1px solid #16a34a';
      div.style.padding='8px'; div.style.borderRadius='8px'; div.style.color='#166534'; div.style.fontWeight='700';
    }
  });
},1000);
</script>
</body>
</html>
