<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Delivery - October 1</title>
<link rel="icon" type="image/png" href="./favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{background:#f9f9f6;margin:0;font-family:'Cairo',sans-serif}
#root{min-height:100vh}
</style>
</head>
<body>
<div id="root"></div>
<script>
// Auth
var auth = sessionStorage.getItem('wd_october1_auth') || localStorage.getItem('wd_october1_auth');
if(auth !== 'true'){location.replace('./index.html');}
try{
  var r=localStorage.getItem('wd_role');
  if(r&&!sessionStorage.getItem('wd_role')){
    sessionStorage.setItem('wd_role',r);
    sessionStorage.setItem('wd_username',localStorage.getItem('wd_username')||'');
  }
  if(localStorage.getItem('wd_october1_auth')==='true') sessionStorage.setItem('wd_october1_auth','true');
}catch(e){}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="./texts.js"></script>
<script src="./sync.js"></script>
<script src="./admin.js"></script>
<script src="./logout.js"></script>
<script src="./status-patch.js"></script>
<!-- Role Guard - يخفي صلاحيات الادمن عن الموظفين -->
<script>
(function(){
  function getRole(){
    try{return (sessionStorage.getItem('wd_role')||localStorage.getItem('wd_role')||'admin').toLowerCase();}catch(e){return 'admin';}
  }
  var role = getRole();
  var isStaff = role === 'staff';
  window.WD_ROLE = role;
  window.WD_IS_STAFF = isStaff;
  window.WD_IS_ADMIN = !isStaff;
  
  if(!isStaff){
    console.log('Admin - Andrew - full access');
    return;
  }
  
  console.log('Staff - October1 - limited to new requests only');
  
  function applyStaff(){
    try{
      // اخفي: لوحة التحكم، الفروع، إدارة النظام، قائمة الطلبات، استيراد شيت
      var hideKeywords = ['لوحة التحكم','الفروع','إدارة النظام','قائمة الطلبات','استيراد شيت أماكن','استيراد شيت'];
      
      document.querySelectorAll('button, a').forEach(function(btn){
        try{
          var t = (btn.textContent||'').trim();
          if(!t || t.length > 50) return;
          
          // تجاهل ازرار داخل البحث
          if(btn.closest && btn.closest('#wd-membership-lookup')) return;
          
          hideKeywords.forEach(function(keyword){
            if(t === keyword || (t.includes(keyword) && t.length < 40)){
              if(keyword === 'الفروع' && t !== 'الفروع') return; // دقة
              if(keyword === 'قائمة الطلبات' && t.includes('قائمة الطلبات')){
                btn.style.display='none';
              } else if(['لوحة التحكم','الفروع','إدارة النظام'].includes(t)){
                btn.style.display='none';
              } else if(t.includes('استيراد شيت')){
                btn.style.display='none';
                var parent = btn.closest('div');
                if(parent && parent.textContent.includes('استيراد')) parent.style.display='none';
              }
            }
          });
        }catch(e){}
      });
      
      // اخفي input file للاستيراد
      document.querySelectorAll('input[type="file"]').forEach(function(inp){
        try{
          if(inp.closest && inp.closest('#wd-membership-lookup')) return;
          var container = inp.closest('div');
          if(container && container.textContent.includes('استيراد')){
            container.style.display='none';
          }
        }catch(e){}
      });
      
      // اخفي حالات الكارنيهات من التعديل
      document.querySelectorAll('[id*="edit" i], [class*="modal" i], [role="dialog"]').forEach(function(modal){
        try{
          modal.querySelectorAll('select').forEach(function(sel){
            var pt = sel.parentElement ? sel.parentElement.textContent : '';
            if(pt.includes('الحالة') || pt.includes('حالة الكارنيهات')){
              sel.parentElement.style.display='none';
            }
          });
          modal.querySelectorAll('label').forEach(function(lbl){
            if(lbl.textContent.includes('الحالة') || lbl.textContent.includes('حالة الكارنيهات')){
              var next = lbl.nextElementSibling;
              if(next && next.tagName==='SELECT') next.style.display='none';
              lbl.style.display='none';
            }
          });
        }catch(e){}
      });
      
      // تأكد ان طلبات جديدة ظاهر
      document.querySelectorAll('button, a').forEach(function(b){
        try{
          var t=(b.textContent||'').trim();
          if(t.includes('طلبات جديدة')){
            b.style.display='';
          }
        }catch(e){}
      });
      
    }catch(e){console.log('Staff filter error', e);}
  }
  
  function boot(){
    setTimeout(applyStaff, 600);
    setTimeout(applyStaff, 1500);
    setTimeout(applyStaff, 3000);
    try{
      new MutationObserver(applyStaff).observe(document.body, {childList:true, subtree:true});
    }catch(e){}
    setInterval(applyStaff, 2500);
  }
  
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
