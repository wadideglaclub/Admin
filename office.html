<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Delivery</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f9f9f6;overflow-x:hidden}
#root{max-width:100vw;padding:8px;overflow-x:hidden}
table td,table th{text-align:center!important}
#wd-membership-lookup{max-width:100%!important}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  var a=sessionStorage.getItem('wd_october1_auth')||localStorage.getItem('wd_october1_auth');
  if(a!=='true') location.replace('./index.html');
  try{
    var r=localStorage.getItem('wd_role');
    if(r&&!sessionStorage.getItem('wd_role')){
      sessionStorage.setItem('wd_role',r);
      sessionStorage.setItem('wd_username',localStorage.getItem('wd_username')||'');
    }
  }catch(e){}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="./texts.js"></script>
<script src="./sync.js"></script>
<script src="./lookup.js"></script>
<script src="./role-guard.js"></script>
<script src="./admin.js" defer></script>
<script src="./logout.js" defer></script>
<script src="./status-patch.js" defer></script>
</body>
</html>
