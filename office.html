<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Delivery - October 1</title>
<link rel="icon" type="image/png" href="./favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{background:#f9f9f6;margin:0;font-family:'Cairo',sans-serif}#root{min-height:100vh}</style>
</head>
<body>
<div id="root"></div>
<script>
var auth = sessionStorage.getItem('wd_october1_auth') || localStorage.getItem('wd_october1_auth');
if(auth !== 'true'){location.replace('./index.html');}
try{
  var r=localStorage.getItem('wd_role');
  if(r&&!sessionStorage.getItem('wd_role')){sessionStorage.setItem('wd_role',r);sessionStorage.setItem('wd_username',localStorage.getItem('wd_username')||'');}
  if(localStorage.getItem('wd_october1_auth')==='true') sessionStorage.setItem('wd_october1_auth','true');
}catch(e){}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="./texts.js"></script>
<script src="./sync.js"></script>
<script src="./admin.js"></script>
<script src="./logout.js"></script>
<script src="./status-patch.js"></script>
<script src="./lookup.js"></script>

<script>
// صلاحيات October1 - نسخة نظيفة مش بتبيض الشاشة
(function(){
  function getRole(){try{return (sessionStorage.getItem('wd_role')||localStorage.getItem('wd_role')||'admin').toLowerCase();}catch(e){return 'admin';}}
  
  function apply(){
    try{
      var role=getRole();
      var isStaff = role==='staff';
      
      // بحث رقم العضوية ظاهر
      var lookup=document.getElementById('wd-membership-lookup');
      if(lookup){
        lookup.style.setProperty('display','block','important');
        lookup.style.setProperty('visibility','visible','important');
      }
      
      // خروج احمر في الاخر
      document.querySelectorAll('button').forEach(function(btn){
        var t=(btn.textContent||'').trim();
        if(t.includes('خروج') && t.length<20){
          btn.style.background='#DC2626';
          btn.style.color='white';
          btn.style.border='none';
          btn.style.borderRadius='12px';
          if(!btn.innerHTML.includes('🚪')) btn.innerHTML='🚪 خروج';
          // انقله للاخر
          try{
            var c=btn.parentElement;
            var d=0;
            while(c && d<5){
              if(c.querySelectorAll('button').length>=4){
                if(c.contains(btn)) c.appendChild(btn);
                break;
              }
              c=c.parentElement; d++;
            }
          }catch(e){}
        }
      });
      
      if(!isStaff) return;
      
      // October1: شيل لوحة التحكم، الفروع، ادارة النظام، تصدير الكل، واتساب
      document.querySelectorAll('button, a').forEach(function(btn){
        var t=(btn.textContent||'').trim();
        if(!t || (btn.closest&&btn.closest('#wd-membership-lookup'))) return;
        
        if(t==='لوحة التحكم' || t.includes('لوحة التحكم')) btn.style.display='none';
        if(t==='الفروع' || (t==='الفروع' && t.length<10)) btn.style.display='none';
        if(t==='إدارة النظام' || t.includes('إدارة النظام')) btn.style.display='none';
        if(t.includes('تصدير الكل') || t.includes('تصدير') || t.includes('Excel') || t.includes('شيت الاكسيل')) btn.style.display='none';
        if(t.toLowerCase().includes('whatsapp') || t.includes('واتساب')) btn.style.display='none';
      });
      
      // شيل input file شيت
      document.querySelectorAll('input[type="file"]').forEach(function(inp){
        if(inp.closest&&inp.closest('#wd-membership-lookup')) return;
        var txt=inp.parentElement?inp.parentElement.textContent:'';
        if(txt.includes('استيراد')||txt.includes('تصدير')||txt.includes('شيت')){var c=inp.closest('div'); if(c) c.style.display='none';}
      });
      
      // خلي طلبات جديدة الرئيسية
      if(!window.__clicked){
        document.querySelectorAll('button').forEach(function(b){
          if(b.textContent.includes('طلبات جديدة')){
            setTimeout(function(){try{b.click(); window.__clicked=true;}catch(e){}}, 900);
          }
        });
      }
      
      // شيل حالة الكارنيهات من التعديل
      document.querySelectorAll('select').forEach(function(sel){
        var p=sel.parentElement?sel.parentElement.textContent:'';
        if(p.includes('الحالة')||p.includes('حالة الكارنيهات')){
          // شوف لو في مودال
          var inModal=false;
          var cur=sel.parentElement;
          var dep=0;
          while(cur&&dep<6){if(cur.matches&&cur.matches('[class*="modal" i], [role="dialog"]')){inModal=true;break;} cur=cur.parentElement; dep++;}
          if(inModal || document.querySelector('[class*="modal" i][style*="block"], [role="dialog"]')){
            sel.parentElement.style.display='none';
          }
        }
      });
      document.querySelectorAll('label').forEach(function(lbl){
        if((lbl.textContent||'').includes('الحالة')||(lbl.textContent||'').includes('حالة الكارنيهات')){
          var sel=lbl.nextElementSibling;
          if(sel&&sel.tagName==='SELECT') sel.style.display='none';
          // لو في مودال
          var inModal=false;
          var cur=lbl.parentElement;
          var dep=0;
          while(cur&&dep<6){if(cur.matches&&cur.matches('[class*="modal" i], [role="dialog"]')){inModal=true;break;} cur=cur.parentElement; dep++;}
          if(inModal) lbl.parentElement.style.display='none';
        }
      });
      
      // غير ادمن لموظفين اكتوبر 1
      document.querySelectorAll('span, div').forEach(function(el){
        if(el.children.length>0) return;
        var t=(el.textContent||'').trim();
        if(t==='أدمن' || t.toLowerCase()==='admin'){el.textContent='موظفين أكتوبر 1';}
        if(t.includes('أندرو أكرم') && t.length<40){el.textContent='موظفين أكتوبر 1';}
      });
      
    }catch(e){console.log(e);}
  }
  
  function boot(){setTimeout(apply,500);setTimeout(apply,1200);setTimeout(apply,2500);try{new MutationObserver(apply).observe(document.body,{childList:true,subtree:true});}catch(e){} setInterval(apply,2000);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
</body>
</html>
