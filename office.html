<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Delivery - October 1</title>
<link rel="icon" type="image/png" href="./favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{background:#f9f9f6;margin:0;font-family:'Cairo',sans-serif}
#root{min-height:100vh}
#wd-membership-lookup{display:block !important; visibility:visible !important;}
/* Modal for Dragon auth */
#dragon-auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:999999;display:none;align-items:center;justify-content:center;padding:16px;}
#dragon-auth-box{width:100%;max-width:360px;background:linear-gradient(180deg,#1A1A1A 0%, #101010 100%);border:1px solid rgba(255,199,0,0.25);border-radius:24px;padding:24px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.8);text-align:center;}
#dragon-auth-box .logo{width:80px;height:80px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;}
#dragon-auth-box .logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 15px rgba(255,199,0,0.4));}
#dragon-auth-box h3{color:#fff;font-weight:900;font-size:18px;margin-bottom:4px;}
#dragon-auth-box p{color:#888;font-size:12px;margin-bottom:16px;}
.dragon-input{width:100%;height:48px;background:#1E1E1E;border:1.5px solid #2B2B2B;border-radius:12px;padding:0 14px;color:#fff;font-size:14px;outline:none;margin-bottom:10px;}
.dragon-input:focus{border-color:#FFC700;}
.dragon-btn{width:100%;height:48px;border:none;border-radius:12px;background:linear-gradient(90deg,#FFC700,#FFB000);color:#000;font-weight:900;font-size:14px;cursor:pointer;margin-top:8px;}
.dragon-btn-cancel{width:100%;height:42px;border:1px solid #333;background:transparent;color:#888;border-radius:12px;margin-top:8px;cursor:pointer;}
.dragon-err{display:none;background:rgba(255,60,60,0.1);border:1px solid rgba(255,60,60,0.2);color:#ff6b6b;border-radius:8px;padding:8px;font-size:12px;margin-bottom:10px;}
</style>
</head>
<body>
<div id="root"></div>

<!-- Modal حماية Dragon -->
<div id="dragon-auth-overlay">
  <div id="dragon-auth-box">
    <div class="logo"><img src="./favicon.png" alt="Wadi Degla"></div>
    <h3>🔒 منطقة محمية</h3>
    <p>أدخل بيانات الأدمن للمتابعة</p>
    <div id="dragon-err" class="dragon-err">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
    <input id="dragon-user" class="dragon-input" placeholder="Username" value="Dragon">
    <input id="dragon-pass" class="dragon-input" type="password" placeholder="Password">
    <button class="dragon-btn" onclick="checkDragonAuth()">دخول</button>
    <button class="dragon-btn-cancel" onclick="closeDragonAuth()">إلغاء</button>
  </div>
</div>

<script>
// Main auth - October1 user only
var auth = sessionStorage.getItem('wd_october1_auth') || localStorage.getItem('wd_october1_auth');
if(auth !== 'true'){location.replace('./index.html');}
try{
  if(localStorage.getItem('wd_october1_auth')==='true') sessionStorage.setItem('wd_october1_auth','true');
}catch(e){}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="./texts.js"></script>
<script src="./sync.js"></script>
<script src="./admin.js"></script>
<script src="./logout.js"></script>
<script src="./status-patch.js"></script>
<script src="./lookup.js"></script>

<script>
// حماية الأزرار بكلمة سر Dragon / Dragon@55
(function(){
  var DRAGON_USER = 'dragon';
  var DRAGON_PASS = 'Dragon@55';
  var pendingAction = null;
  var isDragonAuthenticated = false;
  var authExpiry = 0;
  
  window.checkDragonAuth = function(){
    var u = (document.getElementById('dragon-user').value||'').trim().toLowerCase();
    var p = document.getElementById('dragon-pass').value||'';
    var err = document.getElementById('dragon-err');
    
    if(u === DRAGON_USER && p === DRAGON_PASS){
      isDragonAuthenticated = true;
      authExpiry = Date.now() + (10 * 60 * 1000); // 10 دقائق
      closeDragonAuth();
      err.style.display='none';
      document.getElementById('dragon-pass').value='';
      
      // نفذ العملية المعلقة
      if(pendingAction){
        try{
          var action = pendingAction;
          pendingAction = null;
          setTimeout(function(){action();}, 100);
        }catch(e){}
      }
    } else {
      err.style.display='block';
      document.getElementById('dragon-auth-box').style.animation='shake 0.3s';
      setTimeout(function(){document.getElementById('dragon-auth-box').style.animation='';}, 300);
    }
  };
  
  window.closeDragonAuth = function(){
    document.getElementById('dragon-auth-overlay').style.display='none';
    pendingAction = null;
    document.getElementById('dragon-err').style.display='none';
  };
  
  function isAuthValid(){
    return isDragonAuthenticated && Date.now() < authExpiry;
  }
  
  function showDragonAuth(action){
    pendingAction = action;
    document.getElementById('dragon-auth-overlay').style.display='flex';
    document.getElementById('dragon-pass').focus();
  }
  
  function protectButtons(){
    try{
      // 1. إدارة النظام
      document.querySelectorAll('button, a').forEach(function(btn){
        var t = (btn.textContent||'').trim();
        if(btn.dataset.dragonProtected) return;
        
        if((t === 'إدارة النظام' || t.includes('إدارة النظام')) && t.length < 30){
          if(btn.closest && btn.closest('#wd-membership-lookup')) return;
          btn.dataset.dragonProtected = 'true';
          btn.addEventListener('click', function(e){
            if(isAuthValid()) return;
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            showDragonAuth(function(){
              btn.dataset.dragonProtected = '';
              btn.click();
            });
            return false;
          }, true);
        }
        
        // 2. الفروع
        if(t === 'الفروع' && t.length < 10){
          if(btn.closest && btn.closest('#wd-membership-lookup')) return;
          btn.dataset.dragonProtected = 'true';
          btn.addEventListener('click', function(e){
            if(isAuthValid()) return;
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            showDragonAuth(function(){
              btn.dataset.dragonProtected = '';
              btn.click();
            });
            return false;
          }, true);
        }
        
        // 3. واتساب في قائمة الطلبات
        var lower = t.toLowerCase();
        if((lower.includes('whatsapp') || t.includes('واتساب')) && t.length < 40){
          if(btn.closest && btn.closest('#wd-membership-lookup')) return;
          btn.dataset.dragonProtected = 'true';
          btn.addEventListener('click', function(e){
            if(isAuthValid()) return;
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            showDragonAuth(function(){
              btn.dataset.dragonProtected = '';
              btn.click();
            });
            return false;
          }, true);
        }
      });
      
      // واتساب ايقونات
      document.querySelectorAll('button').forEach(function(btn){
        if(btn.dataset.dragonProtectedWhats) return;
        var html = (btn.innerHTML||'').toLowerCase();
        if(html.includes('whatsapp') && !btn.textContent.includes('خروج')){
          if(btn.closest && btn.closest('#wd-membership-lookup')) return;
          btn.dataset.dragonProtectedWhats = 'true';
          btn.addEventListener('click', function(e){
            if(isAuthValid()) return;
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            showDragonAuth(function(){
              btn.dataset.dragonProtectedWhats = '';
              btn.click();
            });
            return false;
          }, true);
        }
      });
      
      // 4. زرار التعديل - احميه
      document.querySelectorAll('button').forEach(function(btn){
        var t = (btn.textContent||'').trim();
        if(t.includes('تعديل') && t.length < 20){
          if(btn.dataset.dragonProtectedEdit) return;
          if(btn.closest && btn.closest('#wd-membership-lookup')) return;
          btn.dataset.dragonProtectedEdit = 'true';
          btn.addEventListener('click', function(e){
            if(isAuthValid()) return;
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            showDragonAuth(function(){
              btn.dataset.dragonProtectedEdit = '';
              btn.click();
              // بعد ما يفتح التعديل، احمي حالة الكارنيهات
              setTimeout(function(){
                document.querySelectorAll('select').forEach(function(sel){
                  var pt = sel.parentElement ? sel.parentElement.textContent : '';
                  if(pt.includes('الحالة') || pt.includes('حالة الكارنيهات')){
                    if(!isAuthValid()){
                      sel.parentElement.style.display='none';
                    }
                  }
                });
              }, 500);
            });
            return false;
          }, true);
        }
      });
      
    }catch(e){console.log(e);}
  }
  
  function boot(){
    setTimeout(protectButtons, 800);
    setTimeout(protectButtons, 2000);
    try{new MutationObserver(protectButtons).observe(document.body,{childList:true, subtree:true});}catch(e){}
    setInterval(protectButtons, 3000);
  }
  
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  
  // Enter key in modal
  document.addEventListener('keydown', function(e){
    if(e.key==='Enter' && document.getElementById('dragon-auth-overlay').style.display==='flex'){
      checkDragonAuth();
    }
    if(e.key==='Escape'){
      closeDragonAuth();
    }
  });
})();
</script>
</body>
</html>
