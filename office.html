<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards Delivery - October 1</title>
<link rel="icon" type="image/png" href="./favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{background:#f9f9f6;margin:0;font-family:'Cairo',sans-serif}
#root{min-height:100vh}
#wd-membership-lookup{max-width:100% !important; display:block !important;}
</style>
</head>
<body>
<div id="root"></div>
<script>
// Auth check
(function(){
  var auth = sessionStorage.getItem('wd_october1_auth') || localStorage.getItem('wd_october1_auth');
  if(auth !== 'true'){location.replace('./index.html');return;}
  try{
    var r=localStorage.getItem('wd_role');
    if(r&&!sessionStorage.getItem('wd_role')){
      sessionStorage.setItem('wd_role',r);
      sessionStorage.setItem('wd_username',localStorage.getItem('wd_username')||'');
    }
    if(localStorage.getItem('wd_october1_auth')==='true') sessionStorage.setItem('wd_october1_auth','true');
  }catch(e){}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="./texts.js"></script>
<script src="./sync.js"></script>
<script src="./admin.js"></script>
<script src="./logout.js"></script>
<script src="./status-patch.js"></script>
<script src="./lookup.js"></script>

<!-- كل التعديلات لليوزر October1 -->
<script>
(function(){
  function getRole(){
    try{return (sessionStorage.getItem('wd_role')||localStorage.getItem('wd_role')||'admin').toLowerCase();}catch(e){return 'admin';}
  }
  
  function applyStaffMods(){
    try{
      var role = getRole();
      var isStaff = role === 'staff';
      
      // 1. تأكد بحث رقم العضوية ومكان الفرع ظاهر في الاثنين
      var lookup = document.getElementById('wd-membership-lookup');
      if(lookup){
        lookup.style.setProperty('display','block','important');
        lookup.style.setProperty('visibility','visible','important');
        lookup.style.setProperty('max-width','100%','important');
        // حاول تحطه فوق
        var root = document.getElementById('root');
        if(root && lookup.parentNode !== root){
          if(root.firstChild) root.insertBefore(lookup, root.firstChild);
        }
      }
      
      // زرار الخروج في الاخر واحمر
      var logoutBtn = null;
      document.querySelectorAll('button').forEach(function(btn){
        var t = (btn.textContent||'').trim();
        if(t.includes('خروج') && t.length < 20){
          logoutBtn = btn;
          btn.style.background='#DC2626';
          btn.style.backgroundColor='#DC2626';
          btn.style.color='white';
          btn.style.border='none';
          btn.style.borderRadius='12px';
          btn.style.fontWeight='bold';
          if(!btn.innerHTML.includes('🚪')){
            btn.innerHTML='🚪 خروج';
          }
          // انقله للاخر
          try{
            var container = btn.parentElement;
            var attempts=0;
            while(container && attempts<6){
              var btnCount = container.querySelectorAll('button').length;
              if(btnCount >= 4){
                if(container.contains(btn)){
                  // انقل الزرار لاخر الحاوية
                  if(btn.parentElement === container){
                    container.appendChild(btn);
                  } else {
                    var wrapper = btn.parentElement;
                    if(wrapper.querySelectorAll('button').length === 1){
                      container.appendChild(wrapper);
                    } else {
                      container.appendChild(btn);
                    }
                  }
                }
                break;
              }
              container = container.parentElement;
              attempts++;
            }
          }catch(e){}
        }
      });
      
      if(!isStaff){
        console.log('Admin Andrew - full access');
        return;
      }
      
      console.log('Staff October1 - applying all restrictions');
      
      // 2. شيل لوحة التحكم وخلي الصفحة الرئيسية طلبات جديدة
      document.querySelectorAll('button, a').forEach(function(btn){
        try{
          var t = (btn.textContent||'').trim();
          if(!t) return;
          if(btn.closest && btn.closest('#wd-membership-lookup')) return;
          
          // شيل لوحة التحكم
          if(t === 'لوحة التحكم' || t.includes('لوحة التحكم')){
            btn.style.display='none';
          }
          // شيل الفروع (خاص بالادمن)
          if(t === 'الفروع' || (t.includes('الفروع') && t.length < 20)){
            btn.style.display='none';
          }
          // شيل ادارة النظام
          if(t === 'إدارة النظام' || t.includes('إدارة النظام')){
            btn.style.display='none';
          }
          // شيل تصدير الكل وشيت الاكسيل
          if(t.includes('تصدير الكل') || t.includes('تصدير') || (t.toLowerCase().includes('export') && t.length < 30)){
            btn.style.display='none';
            var p = btn.closest('div');
            if(p && p.textContent.includes('تصدير')) p.style.display='none';
          }
          if(t.includes('شيت الاكسيل') || t.includes('Excel') || t.includes('اكسيل')){
            btn.style.display='none';
          }
        }catch(e){}
      });
      
      // شيل اي input file للشيت والتصدير
      document.querySelectorAll('input[type="file"]').forEach(function(inp){
        try{
          if(inp.closest && inp.closest('#wd-membership-lookup')) return;
          var parentText = inp.parentElement ? inp.parentElement.textContent : '';
          if(parentText.includes('استيراد') || parentText.includes('تصدير') || parentText.includes('شيت')){
            var c = inp.closest('div');
            if(c) c.style.display='none';
          }
        }catch(e){}
      });
      
      // شيل علامة الواتس كلها
      document.querySelectorAll('button, a, div, span').forEach(function(el){
        try{
          var txt = (el.textContent||'').trim().toLowerCase();
          var html = (el.innerHTML||'').toLowerCase();
          if(txt.includes('واتساب') || txt.includes('whatsapp') || html.includes('whatsapp') || html.includes('واتساب')){
            if(el.children.length === 0 && txt.length < 40){
              el.style.display='none';
            }
            // لو زرار
            if(el.tagName === 'BUTTON' || el.tagName === 'A'){
              if(txt.includes('واتس') || html.includes('whatsapp')){
                el.style.display='none';
              }
            }
          }
          // شيل ايقونات الواتساب (عادة svg او img)
          if(el.tagName === 'BUTTON' && el.querySelector('svg')){
            var btnText = el.textContent.toLowerCase();
            if(btnText.includes('واتس') || el.innerHTML.toLowerCase().includes('whatsapp')){
              el.style.display='none';
            }
          }
        }catch(e){}
      });
      
      // خلي الصفحة الرئيسية طلبات جديدة بدل لوحة التحكم
      // دور على زرار طلبات جديدة واضغطه تلقائي لو لوحة التحكم كانت ظاهرة
      try{
        var newReqBtn = null;
        document.querySelectorAll('button, a').forEach(function(b){
          var t = (b.textContent||'').trim();
          if(t.includes('طلبات جديدة')){
            newReqBtn = b;
          }
        });
        // لو اول مرة، اضغط طلبات جديدة
        if(newReqBtn && !window.__staffDefaultClicked){
          setTimeout(function(){
            try{
              if(!document.querySelector('[class*="new-request"]') && !window.location.hash.includes('new')){
                newReqBtn.click();
                window.__staffDefaultClicked = true;
              }
            }catch(e){}
          }, 800);
        }
      }catch(e){}
      
      // 3. في زرار التعديل - احذف خانة حالة الكارنيهات drop list كلها
      document.querySelectorAll('*').forEach(function(el){
        try{
          // في المودال
          if(el.matches && (el.matches('[id*="edit" i]') || el.matches('[class*="modal" i]') || el.getAttribute('role')==='dialog')){
            if(el.style.display==='none') return;
            el.querySelectorAll('select').forEach(function(sel){
              var label = sel.previousElementSibling ? sel.previousElementSibling.textContent : '';
              var parentText = sel.parentElement ? sel.parentElement.textContent : '';
              var id = (sel.id||'').toLowerCase();
              if(parentText.includes('الحالة') || parentText.includes('حالة الكارنيهات') || 
                 label.includes('الحالة') || id.includes('status') || id.includes('حالة')){
                sel.style.display='none';
                if(sel.parentElement) sel.parentElement.style.display='none';
                var lbl = sel.parentElement ? sel.parentElement.querySelector('label') : null;
                if(lbl && lbl.textContent.includes('الحالة')) lbl.style.display='none';
              }
            });
            el.querySelectorAll('label').forEach(function(lbl){
              var lt = lbl.textContent||'';
              if(lt.includes('الحالة') || lt.includes('حالة الكارنيهات')){
                lbl.style.display='none';
                var next = lbl.nextElementSibling;
                if(next && next.tagName==='SELECT') next.style.display='none';
                if(lbl.parentElement) lbl.parentElement.style.display='none';
              }
            });
          }
        }catch(e){}
      });
      
      // طريقة تانية مباشرة لكل select في الصفحة لو كان في مودال تعديل مفتوح
      document.querySelectorAll('select').forEach(function(sel){
        try{
          var isInModal = false;
          var parent = sel.parentElement;
          var depth=0;
          while(parent && depth<6){
            if(parent.matches && (parent.matches('[class*="modal" i]') || parent.matches('[id*="edit" i]') || parent.getAttribute('role')==='dialog')){
              isInModal = true;
              break;
            }
            parent = parent.parentElement;
            depth++;
          }
          if(isInModal){
            var txt = sel.parentElement ? sel.parentElement.textContent : '';
            if(txt.includes('الحالة') || txt.includes('حالة الكارنيهات')){
              sel.style.display='none';
              if(sel.parentElement) sel.parentElement.style.display='none';
            }
          }
        }catch(e){}
      });
      
      // 4. غير الادمن لموظفين اكتوبر 1
      document.querySelectorAll('div, span, p, h1, h2, h3').forEach(function(el){
        try{
          if(el.children.length > 0) return;
          var t = (el.textContent||'').trim();
          if(t === 'أدمن' || t.toLowerCase() === 'admin'){
            el.textContent = 'موظفين أكتوبر 1';
            el.style.fontSize='11px';
          }
          if(t.includes('أندرو أكرم') || t.includes('Andrew Akram') || t.includes('أندرو')){
            if(t.length < 40){
              el.textContent = 'موظفين أكتوبر 1';
            }
          }
        }catch(e){}
      });
      
    }catch(e){console.log('Staff mods error', e);}
  }
  
  function boot(){
    setTimeout(applyStaffMods, 500);
    setTimeout(applyStaffMods, 1200);
    setTimeout(applyStaffMods, 2500);
    setTimeout(applyStaffMods, 4000);
    try{new MutationObserver(applyStaffMods).observe(document.body, {childList:true, subtree:true, attributes:true});}catch(e){}
    setInterval(applyStaffMods, 2000);
  }
  
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
