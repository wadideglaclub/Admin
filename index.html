<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cards Delivery - Wadi Degla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0A0A0A;background-image:radial-gradient(700px 400px at 50% 0%, rgba(255,199,0,0.18), transparent 70%), repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 20px);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#fff;padding:16px;}
.frame{width:100%;max-width:430px;background:linear-gradient(180deg, #1A1A1A 0%, #101010 100%);border:1px solid rgba(255,199,0,0.22);border-radius:28px;padding:26px 24px 18px;position:relative;box-shadow:0 0 0 1px rgba(255,199,0,0.08), 0 30px 90px rgba(0,0,0,0.9);overflow:hidden;}
.logo-glow{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:180px;height:180px;background:radial-gradient(circle, rgba(255,199,0,0.35) 0%, rgba(255,199,0,0.12) 35%, transparent 70%);filter:blur(2px);pointer-events:none;}
.logo-box{position:relative;z-index:2;width:160px;height:175px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;}
.logo-box img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 28px rgba(255,199,0,0.6));}
.badge{margin:0 auto;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid rgba(255,199,0,0.28);background:rgba(255,199,0,0.07);color:#FFC700;border-radius:999px;padding:8px 18px;font-size:11px;letter-spacing:3px;font-weight:800;width:fit-content;}
.badge i{width:8px;height:8px;background:#FFC700;border-radius:50%;display:inline-block;box-shadow:0 0 8px #FFC700}
h1{text-align:center;margin-top:18px;font-size:32px;font-weight:900;line-height:1.1;letter-spacing:-0.5px}
h1 span{color:#FFC700}
.welcome{text-align:center;color:#777;margin-top:8px;font-size:14px;font-family:Cairo}
.divider{display:flex;align-items:center;gap:14px;margin:22px 0 20px;color:#3a3410}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, transparent, rgba(255,199,0,0.15), transparent)}
.label{font-size:11px;letter-spacing:2.5px;color:#666;font-weight:800;margin:18px 0 10px;display:flex;justify-content:space-between}
.input-wrap{position:relative;background:#1E1E1E;border:1.5px solid #2B2B2B;border-radius:16px;height:54px;display:flex;align-items:center;padding:0 14px;transition:.2s;}
.input-wrap:focus-within{border-color:#FFC700;box-shadow:0 0 0 3px rgba(255,199,0,0.12)}
.input-wrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px;font-family:Inter;}
.input-wrap input::placeholder{color:#555}
.icon{color:#FFC700;margin-right:10px;display:flex}
.eye{background:none;border:none;color:#666;cursor:pointer;padding:4px;display:flex}
.check-row{display:flex;align-items:center;justify-content:space-between;margin:18px 2px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:#888;cursor:pointer;user-select:none}
.check-box{width:20px;height:20px;border-radius:6px;border:1.5px solid #333;background:#1E1E1E;display:flex;align-items:center;justify-content:center;transition:.2s}
.check.active .check-box{background:#FFC700;border-color:#FFC700;color:#000}
.secure{font-size:10px;letter-spacing:2px;color:#444}
.btn{width:100%;height:56px;border:none;border-radius:16px;background:linear-gradient(90deg, #FFC700 0%, #FFB000 100%);color:#000;font-weight:900;letter-spacing:1.5px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;box-shadow:0 8px 24px rgba(255,199,0,0.35);transition:.15s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(255,199,0,0.45)}
.btn .arrow{width:28px;height:28px;background:rgba(0,0,0,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.foot{display:flex;align-items:center;gap:12px;margin-top:20px;color:#333;font-size:10px;letter-spacing:2px;justify-content:center}
.foot::before,.foot::after{content:'';width:28px;height:1px;background:#2A2A2A}
.err{display:none;background:rgba(255,60,60,0.1);border:1px solid rgba(255,60,60,0.25);color:#ff6b6b;border-radius:10px;padding:10px;text-align:center;font-size:13px;margin-bottom:12px}
.success{display:none;text-align:center;padding:20px 0}
.success .bigcheck{width:90px;height:90px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(180deg, #FFC700, #FFA500);display:flex;align-items:center;justify-content:center;font-size:48px;color:#000;box-shadow:0 0 50px rgba(255,199,0,0.5);}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
<script>try{localStorage.clear();sessionStorage.clear();}catch(e){}</script>

<script>
function toggle(){const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password';}
function normalizeUser(u){return u.trim().toLowerCase().replace(/\s+/g,'');}
async function login(){
 const rawU=document.getElementById('username').value.trim();
 const p=document.getElementById('password').value;
 const err=document.getElementById('err');
 const uw=document.getElementById('uWrap');
 const pw=document.getElementById('pWrap');
 err.style.display='none';
 uw.style.borderColor='#2B2B2B'; pw.style.borderColor='#2B2B2B';
 const u = normalizeUser(rawU);
 let role = null;
 if( (u==='admin' || u==='andrew') && p==='Dragon@55'){ role='admin'; }
 else if( (u==='october1' || u==='october1branch' || u.includes('october')) && p==='WD@12345'){ role='staff'; }
 if(role){
   try{
     sessionStorage.setItem('wd_october1_auth','true');
     sessionStorage.setItem('wd_role', role);
     localStorage.setItem('wd_role', role);
     localStorage.setItem('wd_october1_auth','true');
     sessionStorage.setItem('wd_user', role==='admin'?'Admin':'October 1');
   }catch(e){}
   document.getElementById('loginView').style.display='none';
   document.getElementById('successView').style.display='block';
   document.getElementById('welcomeRole').textContent = role==='admin' ? 'ADMIN • أدمن النظام' : 'OCTOBER 1 BRANCH • فرع أكتوبر 1';
   setTimeout(function(){document.getElementById('bar').style.width='100%'},80);
   setTimeout(function(){location.href='office.html'},800);
 }else{
   err.style.display='block';
   uw.style.borderColor='#ff4444'; pw.style.borderColor='#ff4444';
   document.getElementById('mainFrame').style.animation='shake .3s';
   setTimeout(function(){document.getElementById('mainFrame').style.animation=''},300);
 }
}
document.addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
