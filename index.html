<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="./wadi-favicon-192.png?v=2">
<link rel="apple-touch-icon" href="./wadi-favicon-192.png?v=2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cards Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 min-height:100vh;
 background:#0A0A0A;
 background-image:radial-gradient(700px 400px at 50% 0%, rgba(255,199,0,0.18), transparent 70%), repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 20px);
 display:flex;align-items:center;justify-content:center;
 font-family:'Inter',sans-serif;color:#fff;padding:16px;
}
.frame{
 width:100%;max-width:430px;
 background:linear-gradient(180deg, #1A1A1A 0%, #101010 100%);
 border:1px solid rgba(255,199,0,0.22);
 border-radius:28px;
 padding:26px 24px 18px;
 position:relative;
 box-shadow:0 0 0 1px rgba(255,199,0,0.08), 0 30px 90px rgba(0,0,0,0.9);
 overflow:hidden;
}
.logo-glow{
 position:absolute;top:10px;left:50%;transform:translateX(-50%);
 width:180px;height:180px;background:radial-gradient(circle, rgba(255,199,0,0.35) 0%, rgba(255,199,0,0.12) 35%, transparent 70%);
 filter:blur(2px);pointer-events:none;
}
.logo-box{
 position:relative;z-index:2;
 width:150px;height:165px;margin:0 auto 18px;
 display:flex;align-items:center;justify-content:center;
 background:transparent;border:none;box-shadow:none;
}
.logo-box img{
 background:transparent; width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 28px rgba(255,199,0,0.6));
}
.badge{ margin:0 auto;display:flex;align-items:center;justify-content:center;gap:10px;
 border:1px solid rgba(255,199,0,0.28);background:rgba(255,199,0,0.07);
 color:#FFC700;border-radius:999px;padding:8px 18px;
 font-size:11px;letter-spacing:3px;font-weight:800;
 width:fit-content;
}
.badge i{width:8px;height:8px;background:#FFC700;border-radius:50%;display:inline-block;box-shadow:0 0 8px #FFC700}
h1{text-align:center;margin-top:18px;font-size:32px;font-weight:900;line-height:1.1;letter-spacing:-0.5px}
h1 span{color:#FFC700}
.welcome{text-align:center;color:#777;margin-top:8px;font-size:14px;font-family:Cairo}
.divider{display:flex;align-items:center;gap:14px;margin:22px 0 20px;color:#3a3410}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, transparent, rgba(255,199,0,0.15), transparent)}
.label{font-size:11px;letter-spacing:2.5px;color:#666;font-weight:800;margin:18px 0 10px;display:flex;justify-content:space-between}
.input-wrap{ position:relative;background:#1E1E1E;border:1.5px solid #2B2B2B;border-radius:16px;height:54px; display:flex;align-items:center;padding:0 14px;transition:.2s;}
.input-wrap:focus-within{border-color:#FFC700;box-shadow:0 0 0 3px rgba(255,199,0,0.12)}
.input-wrap input{ flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px; font-family:Inter;}
.input-wrap input::placeholder{color:#555}
.icon{color:#FFC700;margin-right:10px;display:flex}
.eye{background:none;border:none;color:#666;cursor:pointer;padding:4px;display:flex}
.check-row{display:flex;align-items:center;justify-content:space-between;margin:18px 2px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:#888;cursor:pointer;user-select:none}
.check-box{width:20px;height:20px;border-radius:6px;border:1.5px solid #333;background:#1E1E1E;display:flex;align-items:center;justify-content:center;transition:.2s}
.check.active .check-box{background:#FFC700;border-color:#FFC700;color:#000}
.secure{font-size:10px;letter-spacing:2px;color:#444}
.btn{ width:100%;height:56px;border:none;border-radius:16px; background:linear-gradient(90deg, #FFC700 0%, #FFB000 100%); color:#000;font-weight:900;letter-spacing:1.5px;font-size:14px; display:flex;align-items:center;justify-content:center;gap:12px; cursor:pointer;box-shadow:0 8px 24px rgba(255,199,0,0.35);transition:.15s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(255,199,0,0.45)}
.btn .arrow{width:28px;height:28px;background:rgba(0,0,0,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.foot{display:flex;align-items:center;gap:12px;margin-top:20px;color:#333;font-size:10px;letter-spacing:2px;justify-content:center}
.foot::before,.foot::after{content:'';width:28px;height:1px;background:#2A2A2A}
.err{display:none;background:rgba(255,60,60,0.1);border:1px solid rgba(255,60,60,0.25);color:#ff6b6b;border-radius:10px;padding:10px;text-align:center;font-size:13px;margin-bottom:12px}
.success{display:none;text-align:center;padding:20px 0}
.success .bigcheck{ width:90px;height:90px;margin:0 auto 18px;border-radius:50%; background:linear-gradient(180deg, #FFC700, #FFA500); display:flex;align-items:center;justify-content:center; font-size:48px;color:#000;box-shadow:0 0 50px rgba(255,199,0,0.5);}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
<script>try{localStorage.removeItem('wd_october1_auth');localStorage.removeItem('wd_login_time');sessionStorage.removeItem('wd_october1_auth');}catch(e){}</script>
</head>
<body>
<div class="frame" id="mainFrame">
<div class="logo-glow"></div>
<div id="loginView">
  <div class="badge"><i></i> WADI DEGLA CLUBS</div>
  <h1>Cards Delivery <span>System</span></h1>
  <div class="welcome">Welcome Back • مرحباً بعودتك</div>
  <div class="divider" style="justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3z" stroke="#665500" stroke-width="1.5"/></svg></div>
  <div id="err" class="err">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
  <div class="label">USERNAME</div>
  <div class="input-wrap" id="uWrap">
    <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC700" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></span>
    <input id="username" type="text" placeholder="Username (Admin / October 1)" autocomplete="username">
  </div>
  <div class="label" style="margin-top:16px"><span>PASSWORD</span></div>
  <div class="input-wrap" id="pWrap">
    <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="eye" type="button" onclick="toggle()"><svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="check-row">
    <div class="check active" id="rem" onclick="toggleRem()"><div class="check-box" id="box">✓</div> Remember me</div>
    <div class="secure">SECURE LOGIN</div>
  </div>
  <button class="btn" onclick="login()">LOGIN TO SYSTEM <span class="arrow">→</span></button>
  <div class="foot">BRANCH SECURED • WD CLUBS</div>
</div>

<div id="successView" class="success">
  <div class="bigcheck">✓</div>
  <h2 style="font-size:28px;font-weight:900">تم تسجيل الدخول بنجاح</h2>
  <div id="welcomeRole" style="color:#FFC700;letter-spacing:3px;font-size:12px;font-weight:800;margin-top:8px">مرحباً بك</div>
  <div style="margin-top:20px;background:#1A1A1A;border:1px solid rgba(255,199,0,0.12);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;justify-content:center">
    <div style="width:22px;height:22px;border:2.5px solid #FFC700;border-top-color:transparent;border-radius:50%;animation:sp 0.7s linear infinite"></div>
    <span style="color:#777;font-size:14px">جاري تحويلك للنظام...</span>
  </div>
  <div style="height:4px;background:#222;border-radius:99px;overflow:hidden;margin-top:16px"><div id="bar" style="height:100%;width:0%;background:#FFC700;transition:width 1.2s linear"></div></div>
</div>
</div>
<script>
let rem=true;
function toggleRem(){rem=!rem; document.getElementById('rem').classList.toggle('active', rem)}
function toggle(){const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password';}

function normalizeUser(u){
  return u.trim().toLowerCase().replace(/\s+/g,'');
}

async function login(){
 const rawU=document.getElementById('username').value.trim();
 const p=document.getElementById('password').value;
 const err=document.getElementById('err');
 const uw=document.getElementById('uWrap');
 const pw=document.getElementById('pWrap');
 err.style.display='none';
 uw.style.borderColor='#2B2B2B'; pw.style.borderColor='#2B2B2B';

 const u = normalizeUser(rawU);

 let role = null;
 // Admin: Admin / Dragon@55
 if( (u==='admin' || u==='andrew') && p==='Dragon@55'){
   role='admin';
 }
 // Staff: October 1 / WD@12345  (allow october1, october 1, october1 branch etc)
 else if( (u==='october1' || u==='october 1' || u==='october1branch' || u==='october' || u.includes('october')) && p==='WD@12345'){
   role='staff';
 }
 // backward compat for old october1 lower
 else if( p==='WD@12345' && (u.includes('october') || u==='october1')){
   role='staff';
 }

 if(role){
   try{
     sessionStorage.setItem('wd_october1_auth','true');
     sessionStorage.setItem('wd_role', role);
     localStorage.setItem('wd_role', role);
     if(role==='admin'){
       sessionStorage.setItem('wd_user','Admin');
     } else {
       sessionStorage.setItem('wd_user','October 1');
     }
   }catch(e){}
   document.getElementById('loginView').style.display='none';
   document.getElementById('successView').style.display='block';
   document.getElementById('welcomeRole').textContent = role==='admin' ? 'ADMIN • أدمن النظام' : 'OCTOBER 1 BRANCH • فرع أكتوبر 1';
   setTimeout(function(){document.getElementById('bar').style.width='100%'},80);
   setTimeout(function(){location.href='office.html'},900);
 }else{
   err.style.display='block';
   err.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة - جرب Admin / Dragon@55 أو October 1 / WD@12345';
   uw.style.borderColor='#ff4444'; pw.style.borderColor='#ff4444';
   document.getElementById('mainFrame').style.animation='shake .3s';
   setTimeout(function(){document.getElementById('mainFrame').style.animation=''},300);
 }
}
document.addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
</script>
</body>
</html>
