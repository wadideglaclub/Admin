<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="./favicon.png">
<title>October 1 - Wadi Degla | Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0A0A0A;background-image:radial-gradient(700px 400px at 50% 0%, rgba(255,199,0,0.18), transparent 70%), repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 20px);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#fff;padding:16px;}
.frame{width:100%;max-width:360px;background:linear-gradient(180deg, #1A1A1A 0%, #101010 100%);border:1px solid rgba(255,199,0,0.22);border-radius:28px;padding:22px 20px 16px;position:relative;box-shadow:0 0 0 1px rgba(255,199,0,0.08), 0 30px 90px rgba(0,0,0,0.9);overflow:hidden;}
.logo-glow{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:180px;height:180px;background:radial-gradient(circle, rgba(255,199,0,0.35) 0%, rgba(255,199,0,0.12) 35%, transparent 70%);filter:blur(2px);pointer-events:none;}
.logo-box{position:relative;z-index:2;width:90px;height:90px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;}
.logo-box img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 15px rgba(255,199,0,0.4));}
.badge{margin:0 auto;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,199,0,0.28);background:rgba(255,199,0,0.07);color:#FFC700;border-radius:999px;padding:6px 14px;font-size:10px;letter-spacing:2px;font-weight:800;width:fit-content;}
.badge i{width:6px;height:6px;background:#FFC700;border-radius:50%;display:inline-block;box-shadow:0 0 6px #FFC700}
h1{text-align:center;margin-top:10px;font-size:26px;font-weight:900;line-height:1.1;}h1 span{color:#FFC700}
.welcome{text-align:center;color:#777;margin-top:6px;font-size:13px;font-family:Cairo}
.label{font-size:10px;letter-spacing:2px;color:#666;font-weight:800;margin:14px 0 6px;}
.input-wrap{position:relative;background:#1E1E1E;border:1.5px solid #2B2B2B;border-radius:14px;height:50px;display:flex;align-items:center;padding:0 12px;}
.input-wrap:focus-within{border-color:#FFC700;}
.input-wrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px;}
.input-wrap input::placeholder{color:#555}
.btn{width:100%;height:50px;border:none;border-radius:14px;background:linear-gradient(90deg, #FFC700 0%, #FFB000 100%);color:#000;font-weight:900;letter-spacing:1px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin-top:16px;box-shadow:0 6px 20px rgba(255,199,0,0.3);}
.foot{display:flex;align-items:center;gap:10px;margin-top:14px;color:#333;font-size:9px;letter-spacing:1.5px;justify-content:center}
.err{display:none;background:rgba(255,60,60,0.1);border:1px solid rgba(255,60,60,0.25);color:#ff6b6b;border-radius:10px;padding:8px;text-align:center;font-size:12px;margin-bottom:10px}
.success{display:none;text-align:center;padding:16px 0}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="frame">
<div class="logo-glow"></div>
<div id="loginView">
  <div class="logo-box"><img src="./favicon.png" alt="Wadi Degla"></div>
  <div class="badge"><i></i> OCTOBER 1 BRANCH</div>
  <h1>Cards <span>Delivery</span></h1>
  <div class="welcome">October 1 Branch System</div>
  <div id="err" class="err">❌ البيانات غير صحيحة</div>
  <div class="label">USERNAME</div>
  <div class="input-wrap"><input id="username" type="text" placeholder="October1" value="October1"></div>
  <div class="label">PASSWORD</div>
  <div class="input-wrap"><input id="password" type="password" placeholder="WD@12345" value="WD@12345"></div>
  <button class="btn" onclick="login()">LOGIN →</button>
  <div class="foot">WD CLUBS • SECURED</div>
</div>
<div id="successView" class="success">
  <div style="width:70px;height:70px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(180deg,#FFC700,#FFA500);display:flex;align-items:center;justify-content:center;font-size:32px;color:#000;">✓</div>
  <h2 style="font-size:22px;font-weight:900">تم تسجيل الدخول</h2>
  <div style="margin-top:14px;display:flex;align-items:center;gap:10px;justify-content:center"><div style="width:18px;height:18px;border:2px solid #FFC700;border-top-color:transparent;border-radius:50%;animation:sp 0.7s linear infinite"></div><span style="color:#777;font-size:12px">جاري التحميل...</span></div>
</div>
</div>
<script>
async function digest(v){const b=new TextEncoder().encode(v);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h),x=>x.toString(16).padStart(2,'0')).join('');}
async function login(){
  var u=document.getElementById('username').value.trim().toLowerCase();
  var p=document.getElementById('password').value;
  var err=document.getElementById('err');
  err.style.display='none';
  if(!u||!p){err.style.display='block';return;}
  var uh=await digest(u);
  var ph=await digest(p);
  // October1 / WD@12345
  var validU='3d2fa30fc7676bf9bae45099a2b429436c52bc6484446ff1888cb2ed63293845';
  var validP='d6206792dd9e9d0a38050abc3fafbc0c85495deb244024143b0646dd2655069e';
  if(uh===validU && ph===validP){
    try{
      sessionStorage.setItem('wd_october1_auth','true');
      localStorage.setItem('wd_october1_auth','true');
      localStorage.setItem('wd_login_time', Date.now());
    }catch(e){}
    document.getElementById('loginView').style.display='none';
    document.getElementById('successView').style.display='block';
    setTimeout(()=>{location.href='office.html'}, 900);
  }else{
    err.textContent='❌ اسم المستخدم أو كلمة المرور غير صحيحة';
    err.style.display='block';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
